# Conectar este Blueprint a develop mediante la integración de GitHub en Render.
services:
  - type: web
    name: mitbol-frontend
    runtime: static
    branch: develop
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mitbol-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
